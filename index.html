<style>

<body>
<canvas id="c"></canvas>
<div id="rotate" class="ui"><span>&#x21bb;</span>Turn your phone sideways</div>
<div id="tip" class="ui">Full screen: tap Share &#x2191; then <b>Add to Home Screen</b> &nbsp;&#x2715;</div>
<script>
'use strict';
// ======================= DR. MARK =======================
// Lab-beaker capsule puzzle. Line up 4+ of a colour to wipe out the germs:
// Fizz (pink), Glitch (cyan) and Zap (yellow). Made for you by Mark.
const W = 960, H = 540, GW = 8, GH = 16, CELL = 26, NCOL = 3;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function fit() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', fit); fit();
addEventListener('orientationchange', () => setTimeout(fit, 300));
document.addEventListener('fullscreenchange', () => setTimeout(fit, 100));
document.addEventListener('webkitfullscreenchange', () => setTimeout(fit, 100));

// ================= PHONE: bigger screen + no accidental browser swipes =================
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
const onOverlay = e => !!(e.target && e.target.closest && e.target.closest('.ui'));
// keep the browser from scrolling, zooming, pull-to-refresh or swiping pages while you play
const stopGesture = e => { if (e.cancelable) e.preventDefault(); };
['touchstart', 'touchmove'].forEach(ev => document.addEventListener(ev, stopGesture, { passive: false }));
['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, stopGesture, { passive: false }));
// go full screen (and lock sideways) on the first tap where the browser allows it (Android, iPad)
function goBig() {
  if (standalone) return;
  const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!rq || document.fullscreenElement || document.webkitFullscreenElement) return;
  try {
    const pr = rq.call(el, { navigationUI: 'hide' });
    const lock = () => { try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => {}); } catch (e) {} };
    if (pr && pr.then) pr.then(lock).catch(() => {}); else lock();
  } catch (e) {}
}
// a back-swipe that slips through mid-game just pauses instead of leaving the page
let backArmed = false;
function armBack() { if (backArmed) return; backArmed = true; try { history.pushState({ game: 1 }, ''); } catch (e) {} }
addEventListener('popstate', () => {
  backArmed = false;
  if (pauseForSwipe()) armBack();   // only hold you here if a game was running; a 2nd back leaves
});
// iPhone Safari can't go full screen from a web page, so point to Add to Home Screen once
(() => {
  const tip = document.getElementById('tip');
  let seen = false; try { seen = localStorage.getItem('drmark_tip') === '1'; } catch (e) {}
  if (!isIOS || standalone || seen) return;
  tip.style.display = 'block';
  const hide = () => { tip.style.display = 'none'; try { localStorage.setItem('drmark_tip', '1'); } catch (e) {} };
  tip.addEventListener('pointerdown', e => { e.stopPropagation(); hide(); });
  setTimeout(() => { tip.style.display = 'none'; }, 12000);
})();

const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const COL = ['#ff4fa0', '#38e1ff', '#ffd23a'];
const COLD = ['#8a1f52', '#156f80', '#8a6a10'];
const GERM_NAME = ['FIZZ', 'GLITCH', 'ZAP'];
const SPEED_NAME = ['LOW', 'MED', 'HI'], SPEED_FALL = [0.8, 0.5, 0.3];

// ------------------------------------------------------------ storage ----
let best = 0, speedSel = 1, startLevel = 0;
try { best = +localStorage.getItem('drmark_best') || 0; speedSel = +(localStorage.getItem('drmark_speed') ?? 1); startLevel = +localStorage.getItem('drmark_level') || 0; } catch (e) {}
if (!(speedSel >= 0 && speedSel <= 2)) speedSel = 1;
function saveSettings() { try { localStorage.setItem('drmark_speed', String(speedSel)); localStorage.setItem('drmark_level', String(startLevel)); } catch (e) {} }
function saveBest() { try { localStorage.setItem('drmark_best', String(best)); } catch (e) {} }

    text('GERMS ' + b.germs, cx, 58, 14, '#fff');
    text('NEXT', sx, 112, 12, '#ff9fd0'); drawPillPreview(sx, 140, b.next, 0.8);
    text('HOLD', sx, 192, 12, '#ff9fd0'); if (b.hasHold) drawPillPreview(sx, 220, b.hold, 0.8);
    text('WINS', sx, 276, 12, '#ff9fd0');
    for (let k = 0; k < 3; k++) { ctx.fillStyle = k < b.wins ? '#ffd23a' : 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.arc(sx - 22 + k * 22, 300, 8, 0, 7); ctx.fill(); }
  }
  const e = bd[0].expr !== X_SMILE ? bd[0].expr : bd[1].expr;
  drawDrMark(e, W / 2, H - 4, 250);
  text('LV ' + level + '  -  ' + SPEED_NAME[speedSel], W / 2, 60, 14, 'rgba(255,255,255,0.67)');
  textGlow('DR. MARK', W / 2, 30, 26, '#fff', '#ff4fa0');
  if (!demo) drawPauseIcon();
}
function madeBy(x, y, size) {
  textGlow('Made for you by Mark', x - size * 0.4, y, size, '#ff8fc4', '#ff4fa0');
  ctx.font = `bold ${size}px ${FONT}`; const w = ctx.measureText('Made for you by Mark').width;
  heart(x - size * 0.4 + w / 2 + size * 0.75, y, size * 0.42, '#ff4fa0');
}
function drawTitle() {
  drawDrMark(X_WINK, 230, H, 470);
  textGlow('DR. MARK', 650, 92, 72, '#ffe6f2', '#ff4fa0');
  text("The lab's sexiest germ fighter", 650, 146, 18, '#ffd23a');
  for (let c = 0; c < NCOL; c++) drawGerm(560 + c * 90, 200, 20, c, gtime * 1.5 + c, false);
  const labels = ['PLAYERS', 'LEVEL', 'SPEED', 'START'];
  for (let i = 0; i < 4; i++) {
    const b = menuBtn(i), s = menuSel === i;
    fillRR(b.x, b.y, b.w, b.h, 14, s ? 'rgba(255,79,160,0.35)' : 'rgba(255,255,255,0.07)');
    strokeRR(b.x, b.y, b.w, b.h, 14, s ? '#ff4fa0' : 'rgba(255,255,255,0.24)', 2);
    if (i === 3) { text(nPlayers === 2 ? 'START  -  VERSUS' : 'START', b.x + b.w / 2, b.y + b.h / 2, 20, '#fff'); continue; }
    text(labels[i], b.x + 22, b.y + b.h / 2, 18, '#fff', 'left');
    const v = i === 0 ? (nPlayers === 1 ? '1 PLAYER' : '2 VERSUS') : i === 1 ? String(startLevel) : SPEED_NAME[speedSel];
    text('<  ' + v + '  >', b.x + b.w - 22, b.y + b.h / 2, 18, '#ffd23a', 'right');
  }
  text(isTouch ? 'drag to move  -  tap to rotate  -  flick down to drop  -  tap HOLD' : 'Space rotate  -  E hold  -  S/W drop  -  2P: arrows + Enter/Shift',
       650, 486, 13, 'rgba(255,255,255,0.6)');
  madeBy(650, 516, 16);
  if (best > 0) text('BEST  ' + best, W - 20, 20, 15, '#c9c4ff', 'right');
}
function drawOverlay() {
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(10,4,20,0.75)'; ctx.fillRect(0, 0, W, H);
    textGlow('PAUSED', W / 2, 150, 52, '#fff', '#ff4fa0');
    const items = ['RESUME', 'SPEED', 'QUIT TO TITLE'];
    for (let i = 0; i < 3; i++) {
      const b = pauseBtn(i), s = pauseSel === i;
      fillRR(b.x, b.y, b.w, b.h, 14, s ? 'rgba(255,79,160,0.3)' : 'rgba(255,255,255,0.07)');
      strokeRR(b.x, b.y, b.w, b.h, 14, s ? '#ff4fa0' : 'rgba(255,255,255,0.24)', 2);
      if (i === 1) { text('SPEED', b.x + 24, b.y + 25, 20, '#fff', 'left'); text('<  ' + SPEED_NAME[speedSel] + '  >', b.x + b.w - 24, b.y + 25, 20, '#ffd23a', 'right'); }
      else text(items[i], W / 2, b.y + 25, 20, '#fff');
    }
    return;
  }
  const cx0 = bd[0] ? bd[0].x0 + GW * CELL / 2 : W / 2;
  if (state === 'clear') { textGlow('LAB CLEAN!', cx0, 230, 44, '#fff1a0', '#ffb300'); textShadow('Bonus +' + 1000 * (level + 1) * (speedSel + 1), cx0, 280, 20, '#fff'); }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(10,4,20,0.6)'; ctx.fillRect(0, 0, W, H);
    textGlow('THE GERMS WON', cx0, 220, 40, '#fff', '#ff3b5c'); textShadow('SCORE  ' + bd[0].score, cx0, 272, 24, '#fff');
    if (stateT > 1.2) text(isTouch ? 'tap to continue' : 'press Space', cx0, 312, 16, '#b8b4e8');
  }
  if (state === 'round' || state === 'match') {
    const b = bd[winner], cx = b.x0 + GW * CELL / 2;
    textGlow(state === 'match' ? 'CHAMPION!' : 'ROUND WIN!', cx, 230, 38, '#fff1a0', '#ffb300'); textShadow('PLAYER ' + (winner + 1), cx, 274, 22, '#fff');
    if (stateT > 1.2) text(isTouch ? 'tap to continue' : 'press Space', W / 2, H / 2 + 100, 16, '#b8b4e8');
  }
}
function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawBackground();
  if (state === 'title') drawTitle();
  else {
    for (let i = 0; i < nPlayers; i++) drawBeaker(bd[i]);
    if (nPlayers === 1) drawHUD1(); else drawHUD2();
    ctx.globalCompositeOperation = 'lighter';
    for (const q of parts) { ctx.globalAlpha = Math.min(1, q.life / q.max * 1.5); ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, q.size, q.size); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life * 2); textShadow(f.text, f.x, f.y, f.size, f.c); }
    ctx.globalAlpha = 1;
    drawOverlay();
  }
}

// -------------------------------------------------------------- loop -----
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  pollPads(); update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
